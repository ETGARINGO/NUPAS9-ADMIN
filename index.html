<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="icon" type="image/jpg" href="pro9.jpg">
    <link rel="apple-touch-icon" href="pro9.jpg">
    
    <title>ACCESS EXPIRED | PRO9 ADMIN</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #010b1a; 
            position: fixed; font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* The Admin Dashboard is now hidden/blurred completely */
        iframe {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; border: none;
            filter: blur(20px) grayscale(1);
            pointer-events: none; /* Disables all clicks */
            z-index: 1;
        }

        /* Critical Lockout Overlay */
        #access-lock {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(1, 11, 26, 0.98);
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }

        .lock-card {
            background: #0d1117;
            border: 2px solid #ce1212; /* Red Alert Border */
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 50px rgba(206, 18, 18, 0.2);
        }

        .status-icon {
            font-size: 3rem;
            color: #ce1212;
            margin-bottom: 20px;
        }

        .lock-card h2 { 
            color: #fff; 
            margin: 0 0 10px 0; 
            letter-spacing: 1px; 
            text-transform: uppercase;
        }

        .lock-card p { 
            color: #8b949e; 
            font-size: 0.95rem; 
            line-height: 1.6; 
        }

        .billing-summary {
            background: rgba(206, 18, 18, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
            border: 1px solid rgba(206, 18, 18, 0.3);
        }

        .billing-summary span {
            display: block;
            color: #ff4d4d;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .billing-summary strong {
            color: #fff;
            font-size: 1.1rem;
        }

        .btn-renew {
            background: #ce1212;
            color: white;
            text-decoration: none;
            display: block;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            border: none;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-renew:hover {
            background: #f01e1e;
            box-shadow: 0 0 20px rgba(206, 18, 18, 0.4);
        }

        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #010b1a; display: flex; align-items: center;
            justify-content: center; z-index: 1000;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loader">
        <div style="text-align: center;">
            <div style="border: 4px solid #333; border-top: 4px solid #ce1212; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: auto;"></div>
        </div>
    </div>

    <div id="access-lock">
        <div class="lock-card">
            <div class="status-icon">⚠️</div>
            <h2>Subscription Ended</h2>
            <p>Access to the PRO9 Admin Recruitment System has been suspended. Please renew the premium plan to continue.</p>
            
            <div class="billing-summary">
                <span>PREMIUM UPGRADE REQUIRED</span>
                <strong>₱5,999 / Year</strong>
                <div style="color: #8b949e; font-size: 0.85rem; margin-top: 5px;">2 TB Cloud Storage Capacity</div>
            </div>

            <button class="btn-renew" onclick="window.location.href='mailto:billing@pro9.gov.ph?subject=Subscription Renewal - 2TB Plan'">
                CONTACT BILLING TO RENEW
            </button>
            
            <p style="font-size: 0.7rem; margin-top: 20px; color: #444;">
                System Authorized by Elizer T Garingo (Cyber Sec IV)
            </p>
        </div>
    </div>

    <iframe 
        id="secure-frame"
        src="https://script.google.com/macros/s/AKfycbwgnTklGTkyqidBuEUzB3SziXfgcq4HxbivfcLLseCwgBqWglSvgxIX8CV26eVPXslw1Q/exec?page=admin" 
        onload="document.getElementById('loader').style.display='none';">
    </iframe>

    <script>
        // Disable F12 and shortcuts even on the lock screen
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>
</body>
</html>
